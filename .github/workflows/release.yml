name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare unique draft
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
      - run: node --test scripts/release-draft.test.mjs
      - id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-draft.mjs prepare

  build:
    needs: prepare
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_PLATFORM: ${{ matrix.label }}
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
          - platform: macos-latest
            label: macos-arm64
          - platform: macos-15-intel
            label: macos-intel
          - platform: ubuntu-latest
            label: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:check -- --tag "${{ github.ref_name }}"

      - name: Run safety matrix
        run: npm run test:safety

      - name: Build frontend
        run: npm run build

      - name: Build desktop assets
        id: desktop
        uses: tauri-apps/tauri-action@v0
        with:
          # No releaseId/tagName: uploads are exclusively handled by release-draft.mjs.
          releaseDraft: true
          includeUpdaterJson: false
          args: ${{ contains(github.ref_name, '-') && matrix.platform == 'windows-latest' && '--bundles nsis' || '' }}

      - name: Upload desktop assets to prepared draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ARTIFACT_PATHS: ${{ steps.desktop.outputs.artifactPaths }}
        run: node scripts/release-draft.mjs desktop

      - name: Create CLI package
        shell: pwsh
        run: node scripts/package-release.mjs --target cli --build-product

      - name: Upload CLI package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-draft.mjs upload cli

      - name: Create Windows portable executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: node scripts/package-release.mjs --target portable

      - name: Upload Windows portable packages
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-draft.mjs upload portable

  verify:
    name: Verify complete draft
    needs: [prepare, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Draft release listings require push-capable credentials. Verification uses GET only.
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require all platforms to succeed
        run: node -e "if (process.env.PREPARE_RESULT !== 'success' || process.env.BUILD_RESULT !== 'success') throw new Error('Draft preparation or platform build failed; release is incomplete')"
      - name: Verify unique draft and download every asset for checksum validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-draft.mjs verify
