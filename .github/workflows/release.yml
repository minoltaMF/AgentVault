name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows
          - platform: macos-latest
            label: macos-arm64
          - platform: macos-15-intel
            label: macos-intel
          - platform: ubuntu-latest
            label: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:check -- --tag "${{ github.ref_name }}"

      - name: Run safety matrix
        run: npm run test:safety

      - name: Build frontend
        run: npm run build

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: AgentVault ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Create CLI package
        shell: pwsh
        run: node scripts/package-release.mjs --target cli --build-product

      - name: Upload CLI package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(Get-ChildItem -Path "release" -Filter "cc-sessions-cli-v$version-*.zip" -File)
          if ($assets.Count -ne 1) {
            throw "Expected exactly one CLI package for this job, found $($assets.Count)."
          }
          gh release upload "${{ github.ref_name }}" $assets[0].FullName --clobber

      - name: Create Windows portable executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: node scripts/package-release.mjs --target portable

      - name: Upload Windows portable packages
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "release/cc-session-manager-portable-v$version-windows.exe",
            "release/cc-session-manager-portable-v$version-windows.zip"
          )
          foreach ($asset in $assets) {
            if (!(Test-Path $asset)) {
              throw "Windows portable package was not found: $asset"
            }
          }
          gh release upload "${{ github.ref_name }}" $assets --clobber
